<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Browser Cache Invalidation Meta Tags -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>IDentify&deg; Portal</title>
    <link rel="icon" type="image/png" href="./Newicon.png?v=231026_9">
    <link rel="apple-touch-icon" href="./Newicon.png?v=231026_9">
    <!-- Instant Redirect Handler -->
    <script>
        (function() {
            try {
                let searchStr = window.location.search || '';
                const hash = window.location.hash || '';
                if (!searchStr && hash.includes('?')) {
                    searchStr = hash.slice(hash.indexOf('?'));
                }
                const p = new URLSearchParams(searchStr);
                if (p.has('session') || p.get('mode') === 'camera_sync' || p.has('cam') || hash.includes('mobile-camera.html') || hash.includes('session=')) {
                    const sessionId = p.get('session') || p.get('cam') || '';
                    const schoolCode = p.get('school') || 'DPS';
                    window.location.replace(`mobile-camera.html?session=${encodeURIComponent(sessionId)}&school=${encodeURIComponent(schoolCode)}&_t=${Date.now()}`);
                    return;
                }
                const formCode = p.get('form') || p.get('school_form') || (p.get('mode') === 'public_form' ? (p.get('school') || p.get('code')) : null) || p.get('school') || p.get('code');
                if (formCode) {
                    window.location.replace('School_Panel.html?form=' + encodeURIComponent(formCode));
                    return;
                }
            } catch(e){}
            window.location.replace('Login_Panel.html');
        })();
    </script>
</head>
<body style="background-color: #f8fafd;">
</body>
</html>
