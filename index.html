<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IDentify&deg; Portal</title>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <link rel="icon" type="image/png" sizes="64x64" href="./fevicon.png">
    <link rel="apple-touch-icon" href="./idapplogo.png">
    <!-- Instant Redirect Handler -->
    <script>
        (function() {
            try {
                const p = new URLSearchParams(window.location.search);
                const formCode = p.get('form') || p.get('school_form') || (p.get('mode') === 'public_form' ? (p.get('school') || p.get('code')) : null);
                if (formCode) {
                    window.location.replace('School_Panel.html?form=' + encodeURIComponent(formCode));
                    return;
                }
            } catch(e){}
            window.location.replace('Login_Panel.html');
        })();
    </script>
</head>
<body style="background-color: #f8fafd;">
</body>
</html>
