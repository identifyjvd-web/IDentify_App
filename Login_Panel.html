    <script>
        const APP_VERSION = 'JVD 23.10.26';
        const AUTH_USER_KEY = 'student_auth_v1';
        const CONFIG_KEY = 'school_config_v1';
        const DEFAULT_CONFIG = { name: "Delhi Public School", code: "DPS", about: "ID Card Management Software", logo: "" };
        let schoolConfig = { ...DEFAULT_CONFIG };
        let currentUser = null;
        let forgotPasswordTimer = null;
        let adminFailedAttempts = 0;

        const SYSTEM_ADMIN_EMAILS = [
            'identify.jvd@gmail.com'
        ];

        function isSystemAdmin(emailOrUser) {
            if (!emailOrUser) return false;
            const email = (typeof emailOrUser === 'string' ? emailOrUser : (emailOrUser.email || emailOrUser.userId || '')).toLowerCase().trim();
            if (!email) return false;
            return SYSTEM_ADMIN_EMAILS.includes(email) || email === 'admin';
        }

        function loadSchoolConfig() {
            try {
                const raw = localStorage.getItem(CONFIG_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return DEFAULT_CONFIG;
        }

        function loadAuthUser() {
            try {
                const raw = localStorage.getItem(AUTH_USER_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return null;
        }

        function saveAuthUser(user) {
            currentUser = user || null;
            if (user) {
                localStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));
                localStorage.setItem('last_active_time', Date.now());
            } else {
                localStorage.removeItem(AUTH_USER_KEY);
                localStorage.removeItem('last_active_time');
            }
        }

        function xorCipher(str, key = 'IdentifySecretKey') {
            let res = '';
            for (let i = 0; i < str.length; i++) {
                res += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return res;
        }

        function decryptLocal(str) {
            try {
                return xorCipher(atob(str));
            } catch (e) {
                return '';
            }
        }

        function appendGmailSuffix() {
            const inp = document.getElementById('login-user-id');
            if (!inp) return;
            let val = (inp.value || '').trim();
            if (!val) {
                inp.value = '@gmail.com';
                inp.focus();
                try { inp.setSelectionRange(0, 0); } catch(e){}
                return;
            }
            if (val.endsWith('@gmail.com')) {
                // If @gmail.com is already present, select 'gmail.com' so user can immediately type 'hotmail.com' or another provider
                const atIdx = val.lastIndexOf('@');
                inp.focus();
                try { inp.setSelectionRange(atIdx + 1, val.length); } catch(e){}
                return;
            }
            if (val.endsWith('@')) {
                inp.value = val + 'gmail.com';
            } else if (!val.includes('@')) {
                inp.value = val + '@gmail.com';
            } else {
                // If it already has an @domain, replace domain with gmail.com
                const atIdx = val.lastIndexOf('@');
                const prefix = val.substring(0, atIdx);
                inp.value = (prefix || '') + '@gmail.com';
            }
            inp.focus();
            const len = inp.value.length;
            try { inp.setSelectionRange(len, len); } catch(e){}
        }

        function toggleLoginPassword() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('login-password-toggle-icon');
            if (input && icon) {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.setAttribute('data-lucide', show ? 'eye-off' : 'eye');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        function showForgotFields(show) {
            const normalFields = document.getElementById('login-normal-fields');
            const forgotFields = document.getElementById('login-forgot-fields');
            const normalError = document.getElementById('login-error');
            const forgotError = document.getElementById('forgot-error');
            const forgotSuccess = document.getElementById('forgot-success');
            const inputsWrapper = document.getElementById('forgot-inputs-wrapper');
            const timerMsgEl = document.getElementById('forgot-timer-msg');

            if (forgotPasswordTimer) {
                clearInterval(forgotPasswordTimer);
                forgotPasswordTimer = null;
            }

            if (normalError) normalError.classList.add('hidden');
            if (forgotError) forgotError.classList.add('hidden');
            if (forgotSuccess) forgotSuccess.classList.add('hidden');
            if (timerMsgEl) timerMsgEl.classList.add('hidden');

            if (show) {
                normalFields.classList.add('hidden');
                forgotFields.classList.remove('hidden');
                if (inputsWrapper) inputsWrapper.classList.remove('hidden');
            } else {
                normalFields.classList.remove('hidden');
                forgotFields.classList.add('hidden');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        async function submitForgotPassword() {
            const emailInput = document.getElementById('login-forgot-email');
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');
            const btn = document.getElementById('forgot-submit-btn');
            const inputsWrapper = document.getElementById('forgot-inputs-wrapper');
            const timerMsgEl = document.getElementById('forgot-timer-msg');

            if (errorEl) errorEl.classList.add('hidden');
            if (successEl) successEl.classList.add('hidden');
            if (timerMsgEl) timerMsgEl.classList.add('hidden');

            const email = (emailInput ? emailInput.value : '').trim();
            if (!email) {
                if (errorEl) {
                    errorEl.innerText = "Please enter your Email Address.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin w-5 h-5 flex items-center justify-center"></i> Sending...';
            }

            try {
                await window.firebaseAPI.sendPasswordResetEmail(window.auth, email);
                if (inputsWrapper) inputsWrapper.classList.add('hidden');
                if (successEl) {
                    successEl.innerText = "Reset link has been sent to your email. Check inbox.";
                    successEl.classList.remove('hidden');
                }
                if (emailInput) emailInput.value = '';

                if (timerMsgEl) {
                    timerMsgEl.classList.remove('hidden');
                    let timeLeft = 6;
                    timerMsgEl.innerText = `Returning to login page in ${timeLeft} seconds...`;
                    
                    forgotPasswordTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(forgotPasswordTimer);
                            showForgotFields(false);
                        } else {
                            timerMsgEl.innerText = `Returning to login page in ${timeLeft} seconds...`;
                        }
                    }, 1000);
                }
            } catch (error) {
                let errMsg = error.message;
                if (error.code === 'auth/invalid-email') {
                    errMsg = "The email address is invalid.";
                } else if (error.code === 'auth/user-not-found') {
                    errMsg = "No account found with this email.";
                }
                if (errorEl) {
                    errorEl.innerText = errMsg;
                    errorEl.classList.remove('hidden');
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Next <i class="fa-solid fa-arrow-right text-sm"></i>';
                }
            }
        }

        async function fetchSystemConfigFromFirebase() {
            try {
                if (!window.firebaseAPI || !window.db) return;
                const docRef = window.firebaseAPI.doc(window.db, "system", "schoolConfig");
                const docSnap = await window.firebaseAPI.getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    schoolConfig = { ...DEFAULT_CONFIG, ...data };
                    localStorage.setItem(CONFIG_KEY, JSON.stringify(schoolConfig));
                    updateBrandingUI();
                }
            } catch (e) {
                console.error("Failed to fetch config from Firebase", e);
            }
        }

        function updateBrandingUI() {
            // Shared Login Page: keep the IDentify app logo and "Welcome to IDentify°" consistent across all schools
            const el = document.getElementById('login-school-name');
            if (el) el.innerHTML = 'Welcome to IDentify&deg;';
            const loginLogo = document.getElementById('login-logo-container');
            if (loginLogo) loginLogo.innerHTML = '<img src="./Newicon.png?v=231026_8" alt="IDentify App Logo" class="w-full h-full object-contain">';
        }

        function decryptSchoolPassword(encoded) {
            if (!encoded) return '';
            try {
                const raw = atob(encoded);
                const key = 'IdentifySecretKey_2024';
                let res = '';
                for (let i = 0; i < raw.length; i++) {
                    res += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return res;
            } catch(e) {
                return '';
            }
        }

        function encryptSchoolPassword(pwd) {
            if (!pwd) return '';
            const key = 'IdentifySecretKey_2024';
            let res = '';
            for (let i = 0; i < pwd.length; i++) {
                res += String.fromCharCode(pwd.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(res);
        }

        function getDetailedLoginDeviceName() {
            const ua = navigator.userAgent || '';
            if (/iPhone/i.test(ua)) return 'iPhone';
            if (/iPad/i.test(ua)) return 'iPad';
            if (/Android/i.test(ua)) {
                if (/Samsung|SM-|GT-/i.test(ua)) return 'Samsung Android';
                if (/OnePlus/i.test(ua)) return 'OnePlus Android';
                if (/Redmi|POCO|Xiaomi/i.test(ua)) return 'Xiaomi Android';
                if (/Vivo/i.test(ua)) return 'Vivo Android';
                if (/Oppo|Realme/i.test(ua)) return 'Realme/Oppo';
                return 'Android Mobile';
            }
            if (/Windows NT 10.0/i.test(ua) || /Windows NT 11.0/i.test(ua) || /Windows/i.test(ua)) return 'Windows PC';
            if (/Macintosh|Mac OS/i.test(ua)) return 'Mac';
            if (/CrOS/i.test(ua)) return 'Chromebook';
            if (/Linux/i.test(ua)) return 'Linux PC';
            return /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(ua) ? 'Mobile Phone' : 'Desktop PC';
        }

        async function fetchPreciseLocation(fallbackAddress) {
            // 1. Check cached verified location (within 6 hours)
            try {
                const cached = localStorage.getItem('identify_verified_loc');
                const cachedTime = parseInt(localStorage.getItem('identify_verified_loc_time') || '0', 10);
                if (cached && (Date.now() - cachedTime < 6 * 60 * 60 * 1000)) {
                    return cached;
                }
            } catch(e) {}

            // 2. Real GPS / Geolocation (if browser permission granted)
            if (typeof navigator !== 'undefined' && navigator.geolocation) {
                try {
                    const pos = await new Promise((resolve, reject) => {
                        navigator.geolocation.getCurrentPosition(resolve, reject, {
                            enableHighAccuracy: true,
                            timeout: 2000,
                            maximumAge: 180000
                        });
                    });
                    if (pos && pos.coords) {
                        const lat = pos.coords.latitude;
                        const lon = pos.coords.longitude;
                        try {
                            const res = await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${lat}&longitude=${lon}&localityLanguageRequested=en`);
                            if (res.ok) {
                                const data = await res.json();
                                const parts = [data.locality || data.city, data.principalSubdivision, data.countryName].filter(Boolean);
                                const unique = [...new Set(parts)];
                                if (unique.length > 0) {
                                    const result = unique.join(', ');
                                    try {
                                        localStorage.setItem('identify_verified_loc', result);
                                        localStorage.setItem('identify_verified_loc_time', String(Date.now()));
                                    } catch(e){}
                                    return result;
                                }
                            }
                        } catch(e) {}
                    }
                } catch(geoErr) {}
            }

            // 3. BigDataCloud IP Geolocation (highly accurate regional client mapping)
            try {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 1800);
                const res = await fetch('https://api.bigdatacloud.net/data/reverse-geocode-client', { signal: controller.signal });
                clearTimeout(tid);
                if (res.ok) {
                    const data = await res.json();
                    const parts = [data.city || data.locality, data.principalSubdivision, data.countryName].filter(Boolean);
                    const unique = [...new Set(parts)];
                    if (unique.length > 0) {
                        const result = unique.join(', ');
                        try {
                            localStorage.setItem('identify_verified_loc', result);
                            localStorage.setItem('identify_verified_loc_time', String(Date.now()));
                        } catch(e){}
                        return result;
                    }
                }
            } catch(e) {}

            // 4. Fallback to School's Registered Address
            if (fallbackAddress && typeof fallbackAddress === 'string' && fallbackAddress.trim().length > 2) {
                const parts = fallbackAddress.split(',').map(s => s.trim()).filter(Boolean);
                if (parts.length >= 2) {
                    return parts.slice(-2).join(', ');
                } else if (parts.length === 1) {
                    return parts[0];
                }
            }

            // 5. Fallback to ipwho.is
            try {
                const controller = new AbortController();
                const tid = setTimeout(() => controller.abort(), 1200);
                const res = await fetch('https://ipwho.is/', { signal: controller.signal });
                clearTimeout(tid);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.success !== false) {
                        const parts = [data.city, data.region, data.country].filter(Boolean);
                        if (parts.length > 0) return parts.join(', ');
                    }
                }
            } catch(e) {}

            // 6. Stored fallback
            try {
                const old = localStorage.getItem('identify_verified_loc');
                if (old) return old;
            } catch(e) {}

            return 'Location Unavailable';
        }

        async function submitLogin() {
            const rawUserId = (document.getElementById('login-user-id').value || '').trim();
            const password = (document.getElementById('login-password').value || '').trim();

            if (!rawUserId) {

                return;
            }

            if (!password) {
                if (errorEl) {
                    errorEl.innerText = "Please enter your password.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin w-5 h-5 flex items-center justify-center"></i> Authenticating...';
            }
            
            // Clean up any lingering previous session data before attempting new login
            try {
                localStorage.removeItem(CONFIG_KEY);
                localStorage.removeItem('identify_active_school_id');
                saveAuthUser(null);
            } catch(e){}

            try {
                const isSysAdmin = isSystemAdmin(rawUserId);
                let authUser = null;
                let user = null;

                if (isSysAdmin) {
                    // SYSTEM ADMIN LOGIN FLOW
                    const adminEmail = (rawUserId.toLowerCase() === 'admin') ? 'identify.jvd@gmail.com' : rawUserId;
                    const userCredential = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, adminEmail, password);
                    user = userCredential.user;
                    authUser = { userId: 'admin', name: 'Admin', role: 'teacher', viewMode: 'all', email: user.email || adminEmail };
                    saveAuthUser(authUser);

                    // Pre-fetch registered schools so Admin_Panel immediately knows the active school
                    try {

                        if (schoolsSnap.exists() && Array.isArray(schoolsSnap.data().list)) {
                            const list = schoolsSnap.data().list;
                            localStorage.setItem('registered_schools_v1', JSON.stringify(list));
                            if (list.length > 0) {
                                const prevActiveId = localStorage.getItem('identify_active_school_id');
                                const activeSchool = (prevActiveId && list.find(s => s && String(s.id) === String(prevActiveId))) || list[0];
                                if (activeSchool) {
                                    localStorage.setItem('identify_active_school_id', String(activeSchool.id));
                                    localStorage.setItem(CONFIG_KEY, JSON.stringify(activeSchool));
                                }
                            } else {
                                localStorage.removeItem('identify_active_school_id');
                                localStorage.setItem(CONFIG_KEY, JSON.stringify({ name: '', code: '', address: '', contactPerson: '', mobile: '', email: '', logo: '' }));
                            }
                        }
                    } catch(e){}

                    try {
                        sessionStorage.setItem('activity_logged_' + authUser.userId, 'true');
                        await Promise.race([
                            recordLoginActivity({
                                schoolId: 'admin',
                                schoolName: 'System Admin',
                                schoolCode: 'ADMIN',
                                email: user.email || adminEmail,
                                role: 'admin',
                                action: 'Admin Login'
                            }),
                            new Promise(r => setTimeout(r, 1200))
                        ]);
                    } catch(e){}

                    window.location.replace('Admin_Panel.html');
                    return;
                }

                // SCHOOL LOGIN FLOW
                // 1. Fetch registered schools from system/schools and school credentials from system/school_auth
                let schoolsList = [];
                let schoolAuthData = {};

                if (!window.db || !window.firebaseAPI || typeof window.firebaseAPI.doc !== 'function') {
                    throw new Error("Unable to connect to database. Please check your internet connection.");
                }

                // Tier 1: Check localStorage registered schools
                try {
                    const localSchools = JSON.parse(localStorage.getItem('registered_schools_v1') || '[]');
                    if (Array.isArray(localSchools) && localSchools.length > 0) {
                        schoolsList = localSchools;
                    }
                } catch(e){}

                // Tier 2: Try reading system/schools and system/school_auth from Firestore
                try {
                    const schoolsDocRef = window.firebaseAPI.doc(window.db, "system", "schools");
                    const schoolsSnap = await window.firebaseAPI.getDoc(schoolsDocRef);
                    if (schoolsSnap.exists() && Array.isArray(schoolsSnap.data().list)) {
                        schoolsList = schoolsSnap.data().list;
                        try { localStorage.setItem('registered_schools_v1', JSON.stringify(schoolsList)); } catch(e){}
                    }
                } catch (fetchErr) {
                    // On a new device without an active session, Firestore rules block unauthenticated reads.
                    // This is handled by authenticating via Firebase Auth first.
                    console.log("Pre-auth Firestore read notice (will authenticate with Firebase Auth first).");
                }

                try {
                    const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                    const authSnap = await window.firebaseAPI.getDoc(authDocRef);
                    if (authSnap.exists()) {
                        schoolAuthData = authSnap.data() || {};
                    }
                } catch (fetchAuthErr) {}

                // Tier 2B: New Device Bridge Authentication
                // If schoolsList is empty because unauthenticated reads were blocked on a new device,
                // bridge in via silent cloud bridge account to read the registered schools list!
                if (schoolsList.length === 0 && window.auth && window.firebaseAPI && window.firebaseAPI.signInWithEmailAndPassword) {
                    try {
                        await window.firebaseAPI.signInWithEmailAndPassword(window.auth, "public.identify.sync@gmail.com", "PublicSync#2026App");
                        const schoolsDocRef = window.firebaseAPI.doc(window.db, "system", "schools");
                        const schoolsSnap = await window.firebaseAPI.getDoc(schoolsDocRef);
                        if (schoolsSnap.exists() && Array.isArray(schoolsSnap.data().list)) {
                            schoolsList = schoolsSnap.data().list;
                            try { localStorage.setItem('registered_schools_v1', JSON.stringify(schoolsList)); } catch(e){}
                        }
                        const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                        const authSnap = await window.firebaseAPI.getDoc(authDocRef);
                        if (authSnap.exists()) {
                            schoolAuthData = authSnap.data() || {};
                        }
                    } catch (bridgeErr) {
                        console.log("Bridge auth notice:", bridgeErr);
                    }
                }

                // 2. Multi-Tier School Matching (Supports Username without @gmail, School Code, Mobile, or Full Email)
                const searchKey = rawUserId.toLowerCase().trim();
                const cleanKey = searchKey.replace(/@gmail\.com$/, '');

                let matchedSchool = schoolsList.find(s => s && (
                    (s.email && s.email.toLowerCase().trim() === searchKey) ||
                    (s.email && s.email.toLowerCase().trim().replace(/@gmail\.com$/, '') === cleanKey) ||
                    (s.email && s.email.toLowerCase().trim().split('@')[0] === cleanKey) ||
                    (s.code && s.code.toLowerCase().trim() === cleanKey) ||
                    (s.code && s.code.toLowerCase().trim() === searchKey) ||
                    (s.loginId && s.loginId.toLowerCase().trim() === cleanKey) ||
                    (s.mobile && String(s.mobile).trim() === cleanKey) ||
                    (s.id && String(s.id).toLowerCase().trim() === cleanKey)
                ));

                // Tier 3: Check system/school_auth map
                if (!matchedSchool && schoolAuthData && typeof schoolAuthData === 'object') {
                    const authValues = Object.values(schoolAuthData);
                    const foundAuth = authValues.find(a => a && (
                        (a.email && a.email.toLowerCase().trim() === searchKey) ||
                        (a.email && a.email.toLowerCase().trim().replace(/@gmail\.com$/, '') === cleanKey) ||
                        (a.email && a.email.toLowerCase().trim().split('@')[0] === cleanKey) ||
                        (a.code && a.code.toLowerCase().trim() === cleanKey) ||
                        (a.code && a.code.toLowerCase().trim() === searchKey)
                    ));
                    if (foundAuth) {
                        matchedSchool = {
                            id: foundAuth.schoolId || ('school_' + (foundAuth.code || 'sch').toLowerCase()),
                            name: foundAuth.schoolName || foundAuth.code || 'School',
                            code: foundAuth.code || '',
                            email: foundAuth.email || (cleanKey + '@gmail.com'),
                            formActive: foundAuth.formActive !== false,
                            active: foundAuth.active !== false
                        };
                    }
                }

                // Tier 4: Direct query to Firestore 'schools' collection (if session already active)
                if (!matchedSchool && window.firebaseAPI.getDocs && window.firebaseAPI.collection && window.firebaseAPI.query && window.firebaseAPI.where) {
                    try {
                        const schoolsCol = window.firebaseAPI.collection(window.db, "schools");
                        const emailCandidate = searchKey.includes('@') ? searchKey : (cleanKey + '@gmail.com');
                        let q = window.firebaseAPI.query(schoolsCol, window.firebaseAPI.where("email", "==", emailCandidate));
                        let snap = await window.firebaseAPI.getDocs(q);
                        if (snap.empty) {
                            q = window.firebaseAPI.query(schoolsCol, window.firebaseAPI.where("code", "==", searchKey.toUpperCase()));
                            snap = await window.firebaseAPI.getDocs(q);
                        }
                        if (!snap.empty) {
                            const firstDoc = snap.docs[0];
                            matchedSchool = { id: firstDoc.id, ...firstDoc.data() };
                        }
                    } catch(e) {}
                }

                // CRITICAL FIX FOR NEW DEVICES & NO-@GMAIL USERNAME:
                // If not matched locally, auto-append @gmail.com if no domain was entered and authenticate directly
                if (!matchedSchool) {
                    const candidateEmail = searchKey.includes('@') ? searchKey : (cleanKey + '@gmail.com');
                    if (candidateEmail) {
                        // Sign in to Firebase Auth directly with the school email (Login ID)
                        const userCredential = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, candidateEmail, password);
                        user = userCredential.user;

                        // NOW AUTHENTICATED! Firestore permissions are granted!
                        try {
                            const schoolsDocRef = window.firebaseAPI.doc(window.db, "system", "schools");
                            const schoolsSnap = await window.firebaseAPI.getDoc(schoolsDocRef);
                            if (schoolsSnap.exists() && Array.isArray(schoolsSnap.data().list)) {
                                schoolsList = schoolsSnap.data().list;
                                try { localStorage.setItem('registered_schools_v1', JSON.stringify(schoolsList)); } catch(e){}
                            }
                        } catch(e) {
                            console.warn("Post-auth schools fetch:", e);
                        }

                        try {
                            const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                            const authSnap = await window.firebaseAPI.getDoc(authDocRef);
                            if (authSnap.exists()) {
                                schoolAuthData = authSnap.data() || {};
                            }
                        } catch(e) {}

                        matchedSchool = schoolsList.find(s => s && (
                            (s.email && s.email.toLowerCase().trim() === candidateEmail) ||
                            (s.code && s.code.toLowerCase().trim() === candidateEmail)
                        ));

                        if (!matchedSchool) {
                            try {
                                const schoolsCol = window.firebaseAPI.collection(window.db, "schools");
                                const q = window.firebaseAPI.query(schoolsCol, window.firebaseAPI.where("email", "==", candidateEmail));
                                const snap = await window.firebaseAPI.getDocs(q);
                                if (!snap.empty) {
                                    matchedSchool = { id: snap.docs[0].id, ...snap.docs[0].data() };
                                }
                            } catch(e){}
                        }

                        if (!matchedSchool) {
                            matchedSchool = {
                                id: 'school_' + (candidateEmail.split('@')[0].toLowerCase().slice(0, 6) || 'sch'),
                                name: candidateEmail.split('@')[0],
                                code: candidateEmail.split('@')[0].toUpperCase().slice(0, 4),
                                email: candidateEmail,
                                active: true,
                                formActive: true
                            };
                        }
                    } else {
                        throw new Error("On a new device, please enter your registered School Email (Login ID) for your initial login.");
                    }
                }

                if (!matchedSchool) {
                    throw new Error("Invalid email or password. No school found with this email/ID.");
                }

                // 3. School Deactivation Check
                if (matchedSchool.formActive === false || matchedSchool.active === false) {
                    if (window.auth && typeof window.auth.signOut === 'function') window.auth.signOut();
                    throw new Error("This school is currently Deactive. School Login is not allowed.");
                }

                // 4. Strict Password Verification against the school's configured password in Manage Schools
                const schoolEmail = (matchedSchool.email || rawUserId).toLowerCase().trim();
                const safeKey = schoolEmail.replace(/[^a-z0-9]/g, '_');
                const authRecord = schoolAuthData[safeKey];

                let passwordVerified = (user != null);

                if (!passwordVerified && authRecord && authRecord.hash) {
                    const decrypted = decryptSchoolPassword(authRecord.hash);
                    if (decrypted && decrypted === password) {
                        passwordVerified = true;
                    } else {
                        throw new Error("Invalid password. Please enter the password configured for this school in Manage Schools.");
                    }
                }

                // 5. Firebase Authentication with Self-Healing Sync
                if (!user) {
                    try {
                        const userCredential = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, schoolEmail, password);
                        user = userCredential.user;
                    } catch (fbAuthErr) {
                        console.warn("Firebase Auth signIn error:", fbAuthErr.code);

                        // Recovery 1: Newly created school or missing user in Firebase Auth
                        if (fbAuthErr.code === 'auth/user-not-found' && passwordVerified && window.firebaseAPI.createUserWithEmailAndPassword) {
                            try {
                                const newCred = await window.firebaseAPI.createUserWithEmailAndPassword(window.auth, schoolEmail, password);
                                user = newCred.user;
                                console.log("Self-healed: Firebase Auth user created on the fly for:", schoolEmail);
                            } catch(createErr) {
                                console.warn("Auto-create user failed:", createErr);
                            }
                        }

                        // Recovery 2: Firebase Auth password out of sync with Manage Schools password
                        if (!user && (fbAuthErr.code === 'auth/invalid-credential' || fbAuthErr.code === 'auth/wrong-password') && passwordVerified) {
                            const candidates = [
                                matchedSchool.code,
                                matchedSchool.code ? matchedSchool.code.toLowerCase() : '',
                                '123456',
                                'school123',
                                'admin123',
                                schoolEmail.split('@')[0]
                            ].filter(Boolean);

                            for (const cand of candidates) {
                                if (cand === password) continue;
                                try {
                                    const candCred = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, schoolEmail, cand);
                                    if (candCred && candCred.user) {
                                        user = candCred.user;
                                        if (window.firebaseAPI.updatePassword) {
                                            await window.firebaseAPI.updatePassword(user, password).catch(()=>{});
                                            console.log("Self-healed: Password synced in Firebase Auth to match Manage Schools!");
                                        }
                                        break;
                                    }
                                } catch(candErr) {}
                            }
                        }

                        if (!user) {
                            if (fbAuthErr.code === 'auth/user-not-found' || fbAuthErr.code === 'auth/invalid-credential' || fbAuthErr.code === 'auth/wrong-password') {
                                throw new Error("Invalid email or password. Please check your credentials or contact Admin.");
                            }
                            throw fbAuthErr;
                        }
                    }
                }

                if (!user) {
                    throw new Error("Authentication failed. Valid Firebase user session could not be established.");
                }

                // If auth was verified only via Firebase Auth (legacy school without hash), backfill hash to school_auth
                if (!passwordVerified && user) {
                    try {
                        const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                        await window.firebaseAPI.setDoc(authDocRef, {
                            [safeKey]: {
                                email: schoolEmail,
                                code: matchedSchool.code || '',
                                schoolName: matchedSchool.name || '',
                                schoolId: matchedSchool.id || '',
                                formActive: matchedSchool.formActive !== false,
                                active: matchedSchool.active !== false,
                                hash: encryptSchoolPassword(password),
                                updatedAt: Date.now()
                            }
                        }, { merge: true });
                    } catch(e){}
                }

                // If school was missing from system/schools doc list, backfill it so future lookups are instant
                if (!schoolsList.some(s => s && String(s.id) === String(matchedSchool.id))) {
                    try {
                        const updatedSchools = [...schoolsList, matchedSchool];
                        const docRef = window.firebaseAPI.doc(window.db, "system", "schools");
                        window.firebaseAPI.setDoc(docRef, { list: updatedSchools, updatedAt: Date.now() }, { merge: true }).catch(()=>{});
                    } catch(e){}
                }

                // 6. Setup verified school session and redirect to School_Panel.html
                authUser = {
                    userId: (user && user.uid) ? user.uid : String(matchedSchool.id),
                    name: matchedSchool.name || matchedSchool.code || (schoolEmail.split('@')[0]),
                    role: 'school',
                    email: schoolEmail,
                    schoolId: matchedSchool.id
                };

                localStorage.setItem(CONFIG_KEY, JSON.stringify(matchedSchool));
                localStorage.setItem('identify_active_school_id', String(matchedSchool.id));
                saveAuthUser(authUser);

                try {
                    sessionStorage.setItem('activity_logged_' + authUser.userId, 'true');
                    await Promise.race([
                        recordLoginActivity({
                            schoolId: matchedSchool.id,
                            schoolName: matchedSchool.name || matchedSchool.code || 'School',
                            schoolCode: matchedSchool.code || '',
                            schoolLogo: matchedSchool.logo || matchedSchool.logoUrl || '',
                            schoolAddress: matchedSchool.address || '',
                            email: schoolEmail,
                            role: 'school',
                            action: 'School Login'
                        }),
                        new Promise(r => setTimeout(r, 1200))
                    ]);
                } catch(e){}

                window.location.replace('School_Panel.html');
            } catch (error) {
                // Ensure stale session is completely cleared on any failure
                try {
                    localStorage.removeItem(CONFIG_KEY);
                    localStorage.removeItem('identify_active_school_id');
                    saveAuthUser(null);
                } catch(e){}

                if (errorEl) {
                    let errMsg = (error.message && !error.code) ? error.message : "Authentication failed. Please check your credentials.";
                    if (error.code === 'auth/invalid-email') errMsg = "The email address you entered is not valid.";
                    else if (error.code === 'auth/user-not-found') errMsg = "We couldn't find an account matching this email.";
                    else if (error.code === 'auth/wrong-password') errMsg = "The password you entered is incorrect. Please try again.";
                    else if (error.code === 'auth/invalid-credential') errMsg = "Invalid email or password. Please try again.";
                    else if (error.code === 'auth/user-disabled') errMsg = "This account has been temporarily disabled.";
                    else if (error.code === 'auth/too-many-requests') errMsg = "Too many failed attempts. Please reset your password or try again later.";
                    else if (error.code === 'auth/network-request-failed') errMsg = "Network error. Please check your internet connection.";
                    
                    errorEl.innerText = errMsg;
                    errorEl.classList.remove('hidden');
                }
                if (isSystemAdmin(rawUserId)) {
                    adminFailedAttempts++;
                    if (adminFailedAttempts >= 2) {
                        const forgotContainer = document.getElementById('forgot-password-container');
                        if (forgotContainer) forgotContainer.classList.remove('hidden');
                    }
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Login';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        }

        function init() {
            try {
                schoolConfig = loadSchoolConfig();
                updateBrandingUI();
                
                currentUser = loadAuthUser();
                const lastActive = localStorage.getItem('last_active_time');
                if (currentUser && lastActive && (Date.now() - parseInt(lastActive, 10) > 10 * 60 * 1000)) {
                    saveAuthUser(null); // Expired session clear karein
                    currentUser = null;
                }
                if (currentUser) {
                    window.location.replace(currentUser.userId === 'admin' ? 'Admin_Panel.html' : 'School_Panel.html');
                    return;
                }

                // Check for session expired or school deactivated parameter
                const urlParams = new URLSearchParams(window.location.search);
                const msg = urlParams.get('msg');
                if (msg === 'session_expired') {
                    const errorEl = document.getElementById('login-error');
                    if (errorEl) {
                        errorEl.innerText = 'Session expired due to inactivity.';
                        errorEl.classList.remove('hidden');
                    }
                } else if (msg === 'school_deactivated') {
                    const errorEl = document.getElementById('login-error');
                    if (errorEl) {
                        errorEl.innerHTML = '<div class="flex items-center gap-1.5 font-bold"><i class="fa-solid fa-lock text-rose-500"></i> This school is currently Deactive. School Login is not allowed.</div>';
                        errorEl.classList.remove('hidden');
                    }
                }

                // Clean URL so refreshing the page does not reload old query param errors
                if (msg) {
                    try {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } catch(e){}
                }

                // Clear login error automatically when user starts typing
                ['login-id', 'login-password'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.addEventListener('input', () => {
                            const errorEl = document.getElementById('login-error');
                            if (errorEl) errorEl.classList.add('hidden');
                        });
                    }
                });

                // Hide splash screen after delay, or instantly if logged out / session expired / deactivated
                const splash = document.getElementById('initial-splash-screen');
                if (splash) {
                    if (msg === 'logout' || msg === 'session_expired' || msg === 'school_deactivated') {
                        splash.style.opacity = '0';
                        splash.remove();
                    } else {
                        setTimeout(() => {
                            splash.style.transition = 'opacity 0.4s ease';
                            splash.style.opacity = '0';
                            setTimeout(() => {
                                try { splash.remove(); } catch(e){}
                            }, 400);
                        }, 500);
                    }
                }

                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                // Fetch config to check if it changed
                setTimeout(() => {
                    fetchSystemConfigFromFirebase();
                }, 100);
            } catch (e) {
                console.error("Init error:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();

            // Mobile keyboard layout fix
            const overlay = document.getElementById('login-overlay');
            if (overlay) {
                const loginCard = document.getElementById('login-card');
                const inputs = overlay.querySelectorAll('input');
                let blurTimeout = null;
                
                if (loginCard && inputs.length > 0) {
                    inputs.forEach(input => {
                        input.addEventListener('focus', () => {
                            if (blurTimeout) {
                                clearTimeout(blurTimeout);
                                blurTimeout = null;
                            }
                            if (window.innerWidth < 640) {
                                setTimeout(() => {
                                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }, 300);
                            }
                        });
                        input.addEventListener('blur', () => {
                            blurTimeout = setTimeout(() => {
                                // Reset any page/overlay scroll shifts caused by the mobile keyboard
                                overlay.scrollTop = 0;
                                window.scrollTo(0, 0);
                                document.body.scrollTop = 0;
                            }, 100);
                        });
                    });
                }
            }
        });

        // Fallback: Forcefully remove splash screen after 4 seconds just in case of JS failure
        setTimeout(() => {
            const splash = document.getElementById('initial-splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
            }
        }, 4000);

                Install this app on your device for quick access, full-screen experience, and offline support.
            </p>
            <div id="pwa-install-guide" class="hidden mt-3 rounded-2xl bg-emerald-50/80 border border-emerald-100 p-3.5 text-left text-[12px] font-semibold text-slate-700 leading-relaxed"></div>
            <div class="mt-5 flex gap-2.5">
                <button type="button" id="pwa-dismiss-btn" onclick="closePwaInstallPopup(true)" class="flex-1 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-3 text-[13px] font-bold text-slate-600 transition">
                    Not Now
                </button>
                <button type="button" id="pwa-install-btn" onclick="triggerPwaInstall()" class="flex-1 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 py-3 text-[13px] font-extrabold text-white shadow-sm shadow-emerald-500/20 flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-download text-xs"></i> Install App
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const INSTALL_SEEN_KEY = 'identify_install_popup_seen_v1';
            const INSTALLED_KEY = 'identify_pwa_installed_v1';
            window.deferredPwaPrompt = null;

            function isStandaloneMode() {
                return window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true ||
                       localStorage.getItem(INSTALLED_KEY) === '1';
            }

            function shouldShowFirstTimePopup() {
                return !isStandaloneMode() && localStorage.getItem(INSTALL_SEEN_KEY) !== '1';
            }

            window.openPwaInstallPopup = function() {
                if (!shouldShowFirstTimePopup()) return;
                const modal = document.getElementById('pwa-install-modal');
                if (!modal) return;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            window.closePwaInstallPopup = function(markSeen) {
                if (markSeen) {
                    localStorage.setItem(INSTALL_SEEN_KEY, '1');
                }
                const modal = document.getElementById('pwa-install-modal');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            };

            window.triggerPwaInstall = async function() {
                if (window.deferredPwaPrompt) {
                    const promptEvent = window.deferredPwaPrompt;
                    window.deferredPwaPrompt = null;
                    localStorage.setItem(INSTALL_SEEN_KEY, '1');
                    try {
                        promptEvent.prompt();
                        const choiceResult = await promptEvent.userChoice;
                        if (choiceResult && choiceResult.outcome === 'accepted') {
                            localStorage.setItem(INSTALLED_KEY, '1');
                        }
                    } catch (e) {}
                    window.closePwaInstallPopup(true);
                    return;
                }

                // Fallback guide when browser native prompt is not directly available (e.g., iOS Safari)
                const guideEl = document.getElementById('pwa-install-guide');
                const installBtn = document.getElementById('pwa-install-btn');
                const dismissBtn = document.getElementById('pwa-dismiss-btn');
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (guideEl) {
                    guideEl.innerHTML = isIOS
                        ? '<div class="flex items-start gap-2"><i class="fa-solid fa-arrow-up-from-bracket text-emerald-600 mt-0.5"></i><span>Tap the <b>Share</b> button in Safari and select <b>"Add to Home Screen"</b> to install.</span></div>'
                        : '<div class="flex items-start gap-2"><i class="fa-solid fa-ellipsis-vertical text-emerald-600 mt-0.5 px-1"></i><span>Tap the browser menu <b>(⋮)</b> at the top right and select <b>"Install App"</b> or <b>"Add to Home Screen"</b>.</span></div>';
                    guideEl.classList.remove('hidden');
                }
                if (dismissBtn) dismissBtn.classList.add('hidden');
                if (installBtn) {
                    installBtn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> Got It';
                    installBtn.onclick = function() { window.closePwaInstallPopup(true); };
                }
            };

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                window.deferredPwaPrompt = e;
                if (shouldShowFirstTimePopup()) {
                    const splash = document.getElementById('initial-splash-screen');
                    if (!splash || splash.style.opacity === '0') {
                        window.openPwaInstallPopup();
                    }
                }
            });

            window.addEventListener('appinstalled', () => {
                localStorage.setItem(INSTALLED_KEY, '1');
                localStorage.setItem(INSTALL_SEEN_KEY, '1');
                window.deferredPwaPrompt = null;
                window.closePwaInstallPopup(true);
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').then(reg => {
                        // Check for sw.js updates immediately on every page visit
                        try { reg.update(); } catch(e){}
                    }).catch(err => {
                        console.log('Service Worker registration failed:', err);
                    });

                    // Auto-reload page once if a new service worker took over
                    let refreshing = false;
                    navigator.serviceWorker.addEventListener('controllerchange', () => {
                        if (!refreshing) {
                            refreshing = true;
                            window.location.reload();
                        }
                    });
                });
            }

            // Show popup on first visit once splash screen finishes
            window.addEventListener('DOMContentLoaded', () => {
                if (shouldShowFirstTimePopup()) {
                    setTimeout(() => {
                        window.openPwaInstallPopup();
                    }, 2800);
                }

                // Desktop right-click reload
                window.addEventListener('contextmenu', (e) => {
                    const isTouchOnly = window.matchMedia && window.matchMedia('(pointer: coarse)').matches && window.innerWidth < 768;
                    if (isTouchOnly) return;
                    const isDesktop = window.innerWidth >= 768 || (window.matchMedia && window.matchMedia('(pointer: fine)').matches);
                    if (!isDesktop) return;

                    const tag = (e.target && e.target.tagName) ? e.target.tagName.toLowerCase() : '';
                    if (tag === 'input' || tag === 'textarea' || tag === 'select' || (e.target && e.target.isContentEditable)) return;

                    e.preventDefault();
                    window.location.reload();
                }, true);
            });
        })();
    </script>
</body>

</html>
