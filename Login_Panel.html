    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
        import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        const firebaseConfig = {
    apiKey: "AIzaSyBMZ3LUNSQubKjanv4MNyDNsvKwPmsKQY8",
    authDomain: "id3files.firebaseapp.com",
    projectId: "id3files",
    storageBucket: "id3files.firebasestorage.app",
    messagingSenderId: "839961631978",
    appId: "1:839961631978:web:4300cbe1fcb1461878cb93"
};

        try {
            const app = initializeApp(firebaseConfig);
            window.db = getFirestore(app);
            window.auth = getAuth(app);

            window.firebaseAPI = {
                initializeApp, getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, signInAnonymously, onAuthStateChanged, createUserWithEmailAndPassword,
                db: window.db, auth: window.auth, firebaseConfig, doc, getDoc, setDoc
            };
            console.log("Firebase initialized successfully on Login Panel.");
        } catch (e) {
            console.error("Firebase initialization error:", e);
        }
    </script>

        <div id="login-card" class="relative w-full max-w-[340px] rounded-[28px] bg-white shadow-[0_8px_40px_rgba(0,0,0,0.13)] overflow-hidden border border-slate-100 mt-2">
            
            <!-- Punch Hole Cutout (Lanyard Slot) -->

                <div class="w-8 h-1 bg-slate-200/80 rounded-full"></div>
            </div>

            <div class="px-6 pt-9 pb-7">
                <!-- Icon Badge (App Logo & Welcome Branding) -->
                <div class="flex flex-col items-center mb-5">
                    <div class="w-[74px] h-[74px] rounded-3xl border-2 border-emerald-500/20 bg-white flex items-center justify-center shadow-md mb-3 p-1.5 overflow-hidden">
                        <div id="login-logo-container" class="w-full h-full rounded-2xl flex items-center justify-center overflow-hidden">

                    <p class="mt-1 text-[12px] font-bold text-emerald-700">ID Card Management Software</p>

                <!-- Fields -->
                <div class="mt-2">
                    <!-- Normal Login Fields -->
                    <div id="login-normal-fields" class="space-y-4">
                        <div>

                        </div>
                        <div>
                            <label class="flex items-center gap-1.5 text-[11px] font-extrabold uppercase tracking-wider text-slate-500 mb-1.5">

                                </label>

                        <span>By: Javed Ansari</span>

                        <a href="tel:7999565002" class="text-slate-600 hover:text-emerald-600 transition-colors flex items-center gap-1">

                        </a>
                    </div>
                </div>
            </div>
        </div>

    <!-- Scripts -->
    <script>
        const AUTH_USER_KEY = 'student_auth_v1';
        const CONFIG_KEY = 'school_config_v1';
        const DEFAULT_CONFIG = { name: "Delhi Public School", code: "DPS", about: "ID Card Management Software", logo: "" };
        let schoolConfig = { ...DEFAULT_CONFIG };
        let currentUser = null;
        let forgotPasswordTimer = null;
        let adminFailedAttempts = 0;

        const SYSTEM_ADMIN_EMAILS = [
            'identify.jvd@gmail.com'
        ];

        function isSystemAdmin(emailOrUser) {
            if (!emailOrUser) return false;
            const email = (typeof emailOrUser === 'string' ? emailOrUser : (emailOrUser.email || emailOrUser.userId || '')).toLowerCase().trim();
            if (!email) return false;
            return SYSTEM_ADMIN_EMAILS.includes(email) || email === 'admin';
        }

        function loadSchoolConfig() {
            try {
                const raw = localStorage.getItem(CONFIG_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return DEFAULT_CONFIG;
        }

        function loadAuthUser() {
            try {
                const raw = localStorage.getItem(AUTH_USER_KEY);
                if (raw) return JSON.parse(raw);
            } catch (e) {}
            return null;
        }

        function saveAuthUser(user) {
            currentUser = user || null;
            if (user) {
                localStorage.setItem(AUTH_USER_KEY, JSON.stringify(user));
                localStorage.setItem('last_active_time', Date.now());
            } else {
                localStorage.removeItem(AUTH_USER_KEY);
                localStorage.removeItem('last_active_time');
            }
        }

        function xorCipher(str, key = 'IdentifySecretKey') {
            let res = '';
            for (let i = 0; i < str.length; i++) {
                res += String.fromCharCode(str.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return res;
        }

        function decryptLocal(str) {
            try {
                return xorCipher(atob(str));
            } catch (e) {
                return '';
            }
        }

        function toggleLoginPassword() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('login-password-toggle-icon');
            if (input && icon) {
                const show = input.type === 'password';
                input.type = show ? 'text' : 'password';
                icon.setAttribute('data-lucide', show ? 'eye-off' : 'eye');
                if (typeof lucide !== 'undefined') lucide.createIcons();
            }
        }

        function showForgotFields(show) {
            const normalFields = document.getElementById('login-normal-fields');
            const forgotFields = document.getElementById('login-forgot-fields');
            const normalError = document.getElementById('login-error');
            const forgotError = document.getElementById('forgot-error');
            const forgotSuccess = document.getElementById('forgot-success');
            const inputsWrapper = document.getElementById('forgot-inputs-wrapper');
            const timerMsgEl = document.getElementById('forgot-timer-msg');

            if (forgotPasswordTimer) {
                clearInterval(forgotPasswordTimer);
                forgotPasswordTimer = null;
            }

            if (normalError) normalError.classList.add('hidden');
            if (forgotError) forgotError.classList.add('hidden');
            if (forgotSuccess) forgotSuccess.classList.add('hidden');
            if (timerMsgEl) timerMsgEl.classList.add('hidden');

            if (show) {
                normalFields.classList.add('hidden');
                forgotFields.classList.remove('hidden');
                if (inputsWrapper) inputsWrapper.classList.remove('hidden');
            } else {
                normalFields.classList.remove('hidden');
                forgotFields.classList.add('hidden');
            }
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        async function submitForgotPassword() {
            const emailInput = document.getElementById('login-forgot-email');
            const errorEl = document.getElementById('forgot-error');
            const successEl = document.getElementById('forgot-success');
            const btn = document.getElementById('forgot-submit-btn');
            const inputsWrapper = document.getElementById('forgot-inputs-wrapper');
            const timerMsgEl = document.getElementById('forgot-timer-msg');

            if (errorEl) errorEl.classList.add('hidden');
            if (successEl) successEl.classList.add('hidden');
            if (timerMsgEl) timerMsgEl.classList.add('hidden');

            const email = (emailInput ? emailInput.value : '').trim();
            if (!email) {
                if (errorEl) {
                    errorEl.innerText = "Please enter your Email Address.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin w-5 h-5 flex items-center justify-center"></i> Sending...';
            }

            try {
                await window.firebaseAPI.sendPasswordResetEmail(window.auth, email);
                if (inputsWrapper) inputsWrapper.classList.add('hidden');
                if (successEl) {
                    successEl.innerText = "Reset link has been sent to your email. Check inbox.";
                    successEl.classList.remove('hidden');
                }
                if (emailInput) emailInput.value = '';

                if (timerMsgEl) {
                    timerMsgEl.classList.remove('hidden');
                    let timeLeft = 6;
                    timerMsgEl.innerText = `Returning to login page in ${timeLeft} seconds...`;
                    
                    forgotPasswordTimer = setInterval(() => {
                        timeLeft--;
                        if (timeLeft <= 0) {
                            clearInterval(forgotPasswordTimer);
                            showForgotFields(false);
                        } else {
                            timerMsgEl.innerText = `Returning to login page in ${timeLeft} seconds...`;
                        }
                    }, 1000);
                }
            } catch (error) {
                let errMsg = error.message;
                if (error.code === 'auth/invalid-email') {
                    errMsg = "The email address is invalid.";
                } else if (error.code === 'auth/user-not-found') {
                    errMsg = "No account found with this email.";
                }
                if (errorEl) {
                    errorEl.innerText = errMsg;
                    errorEl.classList.remove('hidden');
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = 'Next <i class="fa-solid fa-arrow-right text-sm"></i>';
                }
            }
        }

        async function fetchSystemConfigFromFirebase() {
            try {
                if (!window.firebaseAPI || !window.db) return;
                const docRef = window.firebaseAPI.doc(window.db, "system", "schoolConfig");
                const docSnap = await window.firebaseAPI.getDoc(docRef);
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    schoolConfig = { ...DEFAULT_CONFIG, ...data };
                    localStorage.setItem(CONFIG_KEY, JSON.stringify(schoolConfig));
                    updateBrandingUI();
                }
            } catch (e) {
                console.error("Failed to fetch config from Firebase", e);
            }
        }

        function updateBrandingUI() {
            // Shared Login Page: keep the IDentify app logo and "Welcome to IDentify°" consistent across all schools
            const el = document.getElementById('login-school-name');
            if (el) el.innerHTML = 'Welcome to IDentify&deg;';
            const loginLogo = document.getElementById('login-logo-container');
            if (loginLogo) loginLogo.innerHTML = '<img src="./idapplogo.png" alt="IDentify App Logo" class="w-full h-full object-contain">';
        }

        function decryptSchoolPassword(encoded) {
            if (!encoded) return '';
            try {
                const raw = atob(encoded);
                const key = 'IdentifySecretKey_2024';
                let res = '';
                for (let i = 0; i < raw.length; i++) {
                    res += String.fromCharCode(raw.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return res;
            } catch(e) {
                return '';
            }
        }

        function encryptSchoolPassword(pwd) {
            if (!pwd) return '';
            const key = 'IdentifySecretKey_2024';
            let res = '';
            for (let i = 0; i < pwd.length; i++) {
                res += String.fromCharCode(pwd.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(res);
        }

        async function submitLogin() {
            const rawUserId = (document.getElementById('login-user-id').value || '').trim();
            const password = (document.getElementById('login-password').value || '').trim();
            const errorEl = document.getElementById('login-error');
            const btn = document.getElementById('login-submit-btn');
            if (errorEl) errorEl.classList.add('hidden');
            
            if (!rawUserId) {
                if (errorEl) {
                    errorEl.innerText = "Please enter your Email/User ID.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            if (!password) {
                if (errorEl) {
                    errorEl.innerText = "Please enter your password.";
                    errorEl.classList.remove('hidden');
                }
                return;
            }

            if (btn) {
                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin w-5 h-5 flex items-center justify-center"></i> Authenticating...';
            }
            
            // Clean up any lingering previous session data before attempting new login
            try {
                localStorage.removeItem(CONFIG_KEY);
                localStorage.removeItem('identify_active_school_id');
                saveAuthUser(null);
            } catch(e){}

            try {
                const isSysAdmin = isSystemAdmin(rawUserId);
                let authUser = null;
                let user = null;

                if (isSysAdmin) {
                    // SYSTEM ADMIN LOGIN FLOW
                    const adminEmail = (rawUserId.toLowerCase() === 'admin') ? 'identify.jvd@gmail.com' : rawUserId;
                    const userCredential = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, adminEmail, password);
                    user = userCredential.user;
                    authUser = { userId: 'admin', name: 'Admin', role: 'teacher', viewMode: 'all', email: user.email || adminEmail };
                    saveAuthUser(authUser);
                    window.location.replace('Admin_Panel.html');
                    return;
                }

                // SCHOOL LOGIN FLOW
                // 1. Fetch registered schools from system/schools and school credentials from system/school_auth
                let schoolsList = [];
                let schoolAuthData = {};

                if (!window.db || !window.firebaseAPI || typeof window.firebaseAPI.doc !== 'function') {
                    throw new Error("Unable to connect to database. Please check your internet connection.");
                }

                try {
                    const schoolsDocRef = window.firebaseAPI.doc(window.db, "system", "schools");
                    const schoolsSnap = await window.firebaseAPI.getDoc(schoolsDocRef);
                    if (schoolsSnap.exists() && Array.isArray(schoolsSnap.data().list)) {
                        schoolsList = schoolsSnap.data().list;
                    }
                } catch (fetchErr) {
                    console.warn("Could not fetch schools list:", fetchErr);
                }

                try {
                    const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                    const authSnap = await window.firebaseAPI.getDoc(authDocRef);
                    if (authSnap.exists()) {
                        schoolAuthData = authSnap.data() || {};
                    }
                } catch (fetchAuthErr) {
                    console.warn("Could not fetch school_auth:", fetchAuthErr);
                }

                // 2. Strict matching: Check if rawUserId matches a registered school's email (or code)
                const searchKey = rawUserId.toLowerCase();
                const matchedSchool = schoolsList.find(s => s && (
                    (s.email && s.email.toLowerCase().trim() === searchKey) ||
                    (s.code && s.code.toLowerCase().trim() === searchKey)
                ));

                if (!matchedSchool) {
                    throw new Error("Invalid email or password. No school found with this email.");
                }

                // 3. School Deactivation Check
                if (matchedSchool.formActive === false || matchedSchool.active === false) {
                    throw new Error("This school is currently Deactive. School Login is not allowed.");
                }

                // 4. Strict Password Verification against the school's configured password in Manage Schools
                const schoolEmail = (matchedSchool.email || rawUserId).toLowerCase().trim();
                const safeKey = schoolEmail.replace(/[^a-z0-9]/g, '_');
                const authRecord = schoolAuthData[safeKey];

                let passwordVerified = false;

                if (authRecord && authRecord.hash) {
                    const decrypted = decryptSchoolPassword(authRecord.hash);
                    if (decrypted && decrypted === password) {
                        passwordVerified = true;
                    } else {
                        throw new Error("Invalid password. Please enter the password configured for this school in Manage Schools.");
                    }
                }

                // 5. Strict Authentication with Firebase Auth (Must exist in Firebase Authentication)
                // If user was deleted from Firebase Authentication console, login is strictly denied!
                try {
                    const userCredential = await window.firebaseAPI.signInWithEmailAndPassword(window.auth, schoolEmail, password);
                    user = userCredential.user;
                } catch (fbAuthErr) {
                    if (fbAuthErr.code === 'auth/user-not-found' || fbAuthErr.code === 'auth/invalid-credential') {
                        throw new Error("This account is not registered in Firebase Authentication or credentials are invalid. Please check your credentials or contact Admin.");
                    }
                    throw fbAuthErr;
                }

                if (!user) {
                    throw new Error("Authentication failed. Valid Firebase user session could not be established.");
                }

                // If auth was verified only via Firebase Auth (legacy school without hash), backfill hash to school_auth
                if (!passwordVerified && user) {
                    try {
                        const authDocRef = window.firebaseAPI.doc(window.db, "system", "school_auth");
                        await window.firebaseAPI.setDoc(authDocRef, {
                            [safeKey]: {
                                email: schoolEmail,
                                code: matchedSchool.code || '',
                                schoolName: matchedSchool.name || '',
                                schoolId: matchedSchool.id || '',
                                formActive: matchedSchool.formActive !== false,
                                active: matchedSchool.active !== false,
                                hash: encryptSchoolPassword(password),
                                updatedAt: Date.now()
                            }
                        }, { merge: true });
                    } catch(e){}
                }

                // 6. Setup verified school session and redirect to School_Panel.html
                authUser = {
                    userId: (user && user.uid) ? user.uid : String(matchedSchool.id),
                    name: matchedSchool.name || matchedSchool.code || (schoolEmail.split('@')[0]),
                    role: 'school',
                    email: schoolEmail,
                    schoolId: matchedSchool.id
                };

                localStorage.setItem(CONFIG_KEY, JSON.stringify(matchedSchool));
                localStorage.setItem('identify_active_school_id', String(matchedSchool.id));
                saveAuthUser(authUser);

                window.location.replace('School_Panel.html');
            } catch (error) {
                // Ensure stale session is completely cleared on any failure
                try {
                    localStorage.removeItem(CONFIG_KEY);
                    localStorage.removeItem('identify_active_school_id');
                    saveAuthUser(null);
                } catch(e){}

                if (errorEl) {
                    let errMsg = (error.message && !error.code) ? error.message : "Authentication failed. Please check your credentials.";
                    if (error.code === 'auth/invalid-email') errMsg = "The email address you entered is not valid.";
                    else if (error.code === 'auth/user-not-found') errMsg = "We couldn't find an account matching this email.";
                    else if (error.code === 'auth/wrong-password') errMsg = "The password you entered is incorrect. Please try again.";
                    else if (error.code === 'auth/invalid-credential') errMsg = "Invalid email or password. Please try again.";
                    else if (error.code === 'auth/user-disabled') errMsg = "This account has been temporarily disabled.";
                    else if (error.code === 'auth/too-many-requests') errMsg = "Too many failed attempts. Please reset your password or try again later.";
                    else if (error.code === 'auth/network-request-failed') errMsg = "Network error. Please check your internet connection.";
                    
                    errorEl.innerText = errMsg;
                    errorEl.classList.remove('hidden');
                }
                if (isSystemAdmin(rawUserId)) {
                    adminFailedAttempts++;
                    if (adminFailedAttempts >= 2) {
                        const forgotContainer = document.getElementById('forgot-password-container');
                        if (forgotContainer) forgotContainer.classList.remove('hidden');
                    }
                }
            } finally {
                if (btn) {
                    btn.disabled = false;
                    btn.innerHTML = '<i data-lucide="log-in" class="w-5 h-5"></i> Login';
                    if (typeof lucide !== 'undefined') lucide.createIcons();
                }
            }
        }

        function init() {
            try {
                schoolConfig = loadSchoolConfig();
                updateBrandingUI();
                
                currentUser = loadAuthUser();
                const lastActive = localStorage.getItem('last_active_time');
                if (currentUser && lastActive && (Date.now() - parseInt(lastActive, 10) > 10 * 60 * 1000)) {
                    saveAuthUser(null); // Expired session clear karein
                    currentUser = null;
                }
                if (currentUser) {
                    window.location.replace(currentUser.userId === 'admin' ? 'Admin_Panel.html' : 'School_Panel.html');
                    return;
                }

                // Check for session expired or school deactivated parameter
                const urlParams = new URLSearchParams(window.location.search);
                const msg = urlParams.get('msg');
                if (msg === 'session_expired') {
                    const errorEl = document.getElementById('login-error');
                    if (errorEl) {
                        errorEl.innerText = 'Session expired due to inactivity.';
                        errorEl.classList.remove('hidden');
                    }
                } else if (msg === 'school_deactivated') {
                    const errorEl = document.getElementById('login-error');
                    if (errorEl) {
                        errorEl.innerText = 'This school is currently Deactive. School Login is not allowed.';
                        errorEl.classList.remove('hidden');
                    }
                }

                // Clean URL so refreshing the page does not reload old query param errors
                if (msg) {
                    try {
                        window.history.replaceState({}, document.title, window.location.pathname);
                    } catch(e){}
                }

                // Clear login error automatically when user starts typing
                ['login-id', 'login-password'].forEach(id => {
                    const el = document.getElementById(id);
                    if (el) {
                        el.addEventListener('input', () => {
                            const errorEl = document.getElementById('login-error');
                            if (errorEl) errorEl.classList.add('hidden');
                        });
                    }
                });

                // Hide splash screen after delay, or instantly if logged out / session expired / deactivated
                const splash = document.getElementById('initial-splash-screen');
                if (splash) {
                    if (msg === 'logout' || msg === 'session_expired' || msg === 'school_deactivated') {
                        splash.style.opacity = '0';
                        splash.remove();
                    } else {
                        setTimeout(() => {
                            splash.style.opacity = '0';
                            setTimeout(() => splash.remove(), 500);
                        }, 2500);
                    }
                }

                if (typeof lucide !== 'undefined') lucide.createIcons();
                
                // Fetch config to check if it changed
                setTimeout(() => {
                    fetchSystemConfigFromFirebase();
                }, 100);
            } catch (e) {
                console.error("Init error:", e);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            init();

            // Mobile keyboard layout fix
            const overlay = document.getElementById('login-overlay');
            if (overlay) {
                const loginCard = document.getElementById('login-card');
                const inputs = overlay.querySelectorAll('input');
                let blurTimeout = null;
                
                if (loginCard && inputs.length > 0) {
                    inputs.forEach(input => {
                        input.addEventListener('focus', () => {
                            if (blurTimeout) {
                                clearTimeout(blurTimeout);
                                blurTimeout = null;
                            }
                            if (window.innerWidth < 640) {
                                setTimeout(() => {
                                    input.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }, 300);
                            }
                        });
                        input.addEventListener('blur', () => {
                            blurTimeout = setTimeout(() => {
                                // Reset any page/overlay scroll shifts caused by the mobile keyboard
                                overlay.scrollTop = 0;
                                window.scrollTo(0, 0);
                                document.body.scrollTop = 0;
                            }, 100);
                        });
                    });
                }
            }
        });

        // Fallback: Forcefully remove splash screen after 4 seconds just in case of JS failure
        setTimeout(() => {
            const splash = document.getElementById('initial-splash-screen');
            if (splash) {
                splash.style.opacity = '0';
                setTimeout(() => splash.remove(), 500);
            }
        }, 4000);
    </script>
    <!-- First-Time PWA Install Popup Modal -->
    <div id="pwa-install-modal" class="fixed inset-0 z-[99990] hidden items-center justify-center bg-slate-900/50 backdrop-blur-sm p-4 transition-opacity duration-300">
        <div class="relative w-full max-w-[340px] rounded-[28px] bg-white p-6 shadow-2xl border border-slate-100 text-center animate-in zoom-in-95 duration-200">
            <div class="mx-auto mb-3.5 w-16 h-16 rounded-2xl bg-emerald-50 border border-emerald-100 flex items-center justify-center shadow-sm overflow-hidden p-2">
                <img src="./idapplogo.png" alt="IDentify&deg;" class="w-full h-full object-contain" onerror="this.src='./icon_192.png'">
            </div>
            <h3 class="text-[18px] font-extrabold text-slate-800">Install IDentify&deg; App</h3>
            <p id="pwa-install-desc" class="mt-1.5 text-[13px] font-medium text-slate-500 leading-relaxed">
                Install this app on your device for quick access, full-screen experience, and offline support.
            </p>
            <div id="pwa-install-guide" class="hidden mt-3 rounded-2xl bg-emerald-50/80 border border-emerald-100 p-3.5 text-left text-[12px] font-semibold text-slate-700 leading-relaxed"></div>
            <div class="mt-5 flex gap-2.5">
                <button type="button" id="pwa-dismiss-btn" onclick="closePwaInstallPopup(true)" class="flex-1 rounded-xl bg-slate-100 hover:bg-slate-200 active:bg-slate-300 py-3 text-[13px] font-bold text-slate-600 transition">
                    Not Now
                </button>
                <button type="button" id="pwa-install-btn" onclick="triggerPwaInstall()" class="flex-1 rounded-xl bg-emerald-500 hover:bg-emerald-600 active:bg-emerald-700 py-3 text-[13px] font-extrabold text-white shadow-sm shadow-emerald-500/20 flex items-center justify-center gap-1.5 transition">
                    <i class="fa-solid fa-download text-xs"></i> Install App
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            const INSTALL_SEEN_KEY = 'identify_install_popup_seen_v1';
            const INSTALLED_KEY = 'identify_pwa_installed_v1';
            window.deferredPwaPrompt = null;

            function isStandaloneMode() {
                return window.matchMedia('(display-mode: standalone)').matches ||
                       window.navigator.standalone === true ||
                       localStorage.getItem(INSTALLED_KEY) === '1';
            }

            function shouldShowFirstTimePopup() {
                return !isStandaloneMode() && localStorage.getItem(INSTALL_SEEN_KEY) !== '1';
            }

            window.openPwaInstallPopup = function() {
                if (!shouldShowFirstTimePopup()) return;
                const modal = document.getElementById('pwa-install-modal');
                if (!modal) return;
                modal.classList.remove('hidden');
                modal.classList.add('flex');
            };

            window.closePwaInstallPopup = function(markSeen) {
                if (markSeen) {
                    localStorage.setItem(INSTALL_SEEN_KEY, '1');
                }
                const modal = document.getElementById('pwa-install-modal');
                if (modal) {
                    modal.classList.add('hidden');
                    modal.classList.remove('flex');
                }
            };

            window.triggerPwaInstall = async function() {
                if (window.deferredPwaPrompt) {
                    const promptEvent = window.deferredPwaPrompt;
                    window.deferredPwaPrompt = null;
                    localStorage.setItem(INSTALL_SEEN_KEY, '1');
                    try {
                        promptEvent.prompt();
                        const choiceResult = await promptEvent.userChoice;
                        if (choiceResult && choiceResult.outcome === 'accepted') {
                            localStorage.setItem(INSTALLED_KEY, '1');
                        }
                    } catch (e) {}
                    window.closePwaInstallPopup(true);
                    return;
                }

                // Fallback guide when browser native prompt is not directly available (e.g., iOS Safari)
                const guideEl = document.getElementById('pwa-install-guide');
                const installBtn = document.getElementById('pwa-install-btn');
                const dismissBtn = document.getElementById('pwa-dismiss-btn');
                const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
                if (guideEl) {
                    guideEl.innerHTML = isIOS
                        ? '<div class="flex items-start gap-2"><i class="fa-solid fa-arrow-up-from-bracket text-emerald-600 mt-0.5"></i><span>Tap the <b>Share</b> button in Safari and select <b>"Add to Home Screen"</b> to install.</span></div>'
                        : '<div class="flex items-start gap-2"><i class="fa-solid fa-ellipsis-vertical text-emerald-600 mt-0.5 px-1"></i><span>Tap the browser menu <b>(⋮)</b> at the top right and select <b>"Install App"</b> or <b>"Add to Home Screen"</b>.</span></div>';
                    guideEl.classList.remove('hidden');
                }
                if (dismissBtn) dismissBtn.classList.add('hidden');
                if (installBtn) {
                    installBtn.innerHTML = '<i class="fa-solid fa-check text-xs"></i> Got It';
                    installBtn.onclick = function() { window.closePwaInstallPopup(true); };
                }
            };

            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                window.deferredPwaPrompt = e;
                if (shouldShowFirstTimePopup()) {
                    const splash = document.getElementById('initial-splash-screen');
                    if (!splash || splash.style.opacity === '0') {
                        window.openPwaInstallPopup();
                    }
                }
            });

            window.addEventListener('appinstalled', () => {
                localStorage.setItem(INSTALLED_KEY, '1');
                localStorage.setItem(INSTALL_SEEN_KEY, '1');
                window.deferredPwaPrompt = null;
                window.closePwaInstallPopup(true);
            });

            if ('serviceWorker' in navigator) {
                window.addEventListener('load', () => {
                    navigator.serviceWorker.register('./sw.js').catch(err => {
                        console.log('Service Worker registration failed:', err);
                    });
                });
            }

            // Show popup on first visit once splash screen finishes
            window.addEventListener('DOMContentLoaded', () => {
                if (shouldShowFirstTimePopup()) {
                    setTimeout(() => {
                        window.openPwaInstallPopup();
                    }, 2800);
                }
            });
        })();
    </script>
